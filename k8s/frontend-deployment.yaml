apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: frontend:custom
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80 # Assuming your frontend Dockerfile exposes Nginx on 80
        
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: 80       # Port the Ingress talks to
      targetPort: 80 # Port the Container listens on