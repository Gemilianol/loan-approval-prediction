apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: frontend:custom
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80 # Assuming your frontend Dockerfile exposes Nginx on 80
    # --- PROBES START ---
        
        # Liveness: "Are you frozen?"
        # Logic: If Nginx stops answering on port 80, kill it.
        livenessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 5  # Give it 5s to boot
          periodSeconds: 10       # Check every 10s

        # Readiness: "Can users see the site?"
        # Logic: If index.html isn't serve-able, don't send traffic.
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
        # --- PROBES END ---
        
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: 80       # Port the Ingress talks to
      targetPort: 80 # Port the Container listens on