# THIS manifest is not sent to the Kubernetes API server. It is consumed by Kind
# Since we need Ingress (ports 80/443), we cannot use the default cluster.
# This manifest does not create routing. It creates the physical possibility of routing.
# Ingress manifests only work because this file exists.
kind: Cluster # not a pod or deployment.
apiVersion: kind.x-k8s.io/v1alpha4 # Kind’s internal API / Versioned independently from Kubernetes
nodes:
- role: control-plane # "Create a container that acts as the Master Node (Control Plane)."
  # Kind uses kubeadm internally, and this section lets you patch kubeadm’s config.
  # You are injecting low-level cluster behavior.
  kubeadmConfigPatches: # This section allows us to inject custom settings into the K8s startup process.
  - |
    kind: InitConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "ingress-ready=true"
# If this label is missing, the Ingress Controller might not start correctly.
# Ingress defines routing inside the cluster; extraPortMappings defines how traffic enters the cluster at all.
  extraPortMappings:
  - containerPort: 80
    hostPort: 80 # localhost:80 → Kind-Node:80 (Ingress Controller)
    protocol: TCP # Standard HTTP (unsecured).
  - containerPort: 443
    hostPort: 443 # localhost:443 → Kind-Node:443 (Ingress Controller)
    protocol: TCP # Standard HTTPS (secured with SSL/TLS).